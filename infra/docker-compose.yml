services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: movie-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../apps/api/.env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: movie-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
